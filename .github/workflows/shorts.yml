name: Simple Stickman Reel

# One job: payload (package JSON from Claude chat) -> voice -> Cloudflare images -> video -> Buffer.
# Chat package: pushing jobs/package.json starts a run that uses it.
# Manual run (GitHub Mobile): Actions > Simple Stickman Reel > Run workflow, then paste the package JSON.
# Secrets: GEMINI_API_KEY, GEMINI_API_KEY_2, CF_ACCOUNT_ID, CF_API_TOKEN, CF_ACCOUNT_ID_2, CF_API_TOKEN_2, BUFFER_TOKEN.
# Variables (or secrets): BUFFER_YOUTUBE_CHANNEL_ID, BUFFER_INSTAGRAM_CHANNEL_ID, BUFFER_FACEBOOK_CHANNEL_ID (optional).
# Look: plain black background, no music, always. Art style: from the package, else the art_style input, else random.

on:
  push:
    paths:
      - "jobs/package.json"
  workflow_dispatch:
    inputs:
      package:
        description: "Package JSON from Claude chat (title, description, hook, art_style, voice_style, scenes with narration + image_prompt)"
        required: true
      art_style:
        description: "Art style when the package has none (random = one of the six)"
        required: false
        type: choice
        default: random
        options:
          - random
          - indian_storybook
          - sketchbook_doodle
          - whimsical_indian
          - editorial_pencil
          - stickman_sepia
          - village_storybook

permissions:
  contents: read

concurrency:
  group: simple-stickman-reel
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ffmpeg: a cached static build (apt was very slow). Fonts: three small packages kept as cached .deb files.
      - name: Cache ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-v1

      - name: Cache font packages
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: make-apt-debs-v1

      - name: Install ffmpeg and fonts
        run: |
          bash pipeline/setup_ffmpeg.sh
          bash pipeline/setup_fonts.sh

      - name: Install Python packages
        run: |
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -c constraints.txt -r requirements.txt

      - name: Cache Whisper and alignment models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: whisperx-large-v3-turbo-hi-v2

      - name: Make the video and publish it
        id: make
        env:
          PACKAGE: ${{ inputs.package }}
          ART_STYLE: ${{ inputs.art_style }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ vars.BUFFER_YOUTUBE_CHANNEL_ID || secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ vars.BUFFER_INSTAGRAM_CHANNEL_ID || secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ vars.BUFFER_FACEBOOK_CHANNEL_ID || secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -f jobs/package.json ]; then
            export PACKAGE="$(cat jobs/package.json)"
          fi
          python pipeline/run_shorts.py

      - name: Keep a copy as a release
        if: always() && steps.make.outputs.video_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "reel-${{ github.run_number }}" output/video.mp4 \
            --title "Reel ${{ github.run_number }}" --notes "Made by run ${{ github.run_id }}" || true
          # keep only the 20 newest releases
          gh release list --limit 100 --json tagName --jq '.[20:][].tagName' | xargs -r -I{} gh release delete {} --yes --cleanup-tag || true
